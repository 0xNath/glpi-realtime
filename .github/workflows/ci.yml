name: CI

# Pull requests, master, release tags; every Monday too (02:00 UTC), so that the GLPI
# nightly jobs say how this week's GLPI fares even without a commit.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      e2e_repeat:
        description: "Runs of each e2e test on GLPI 12.0 (flaky tests show up)"
        default: "1"

permissions:
  contents: read

# A pull request's new commits cancel its older run; master and tags run to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (the version in the comment); Dependabot updates them.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Valkey >= 9.0 (hash field TTLs): its binary, from the official image.
      - name: Valkey
        run: |
          id=$(docker create valkey/valkey:9.0)
          sudo docker cp "$id":/usr/local/bin/valkey-server /usr/local/bin/valkey-server
          docker rm "$id"
          valkey-server --version

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: redis, igbinary

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client

      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Translations template up to date
        run: python3 scripts/i18n.py --check
      - name: All suites (Rust, PHP plugin, client)
        run: scripts/test-all.sh
      - name: Bundle up to date
        run: |
          (cd client && npm run -s build)
          git diff --exit-code -- plugin/public/realtime.js || { echo "run 'npm run build' in client/ and commit"; exit 1; }

  # What the unit and integration tests exercise, in the run's summary. Informational: no
  # threshold, and not a required check (the browser code is mostly covered by e2e).
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Valkey
        run: |
          id=$(docker create valkey/valkey:9.0)
          sudo docker cp "$id":/usr/local/bin/valkey-server /usr/local/bin/valkey-server
          docker rm "$id"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: coverage
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      # The plugin's tests (pcov: their coverage), and the interoperability tests, which run
      # the plugin's PHP against the server.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: redis, igbinary
          coverage: pcov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Coverage
        run: |
          scripts/coverage.sh | tee coverage.txt
          { echo '## Coverage (unit and integration tests)'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The server, static (musl), for the end-to-end environments below.
  server-bin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: musl
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        working-directory: server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glpi-realtime-musl
          path: server/target/x86_64-unknown-linux-musl/release/glpi-realtime
          retention-days: 3

  # End-to-end, in Chromium, against disposable GLPIs (e2e/env), the plugin installed with
  # deploy/install.sh: GLPI 11 (latest 11.0), the oldest and the latest 12.0 release; the
  # next 12.0 (nightly) and GLPI's main branch (dev-nightly, the plugin's version bound
  # lifted) as warnings only; and an upgrade from the previous release.
  e2e:
    needs: server-bin
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { glpi: "11.0", experimental: false }
          - { glpi: "12.0.0", experimental: false }
          - { glpi: "12.0", experimental: false }
          - { glpi: "12.0", upgrade: true, experimental: false }
          - { glpi: "12.0-nightly", experimental: true }
          - { glpi: "dev-nightly", max: "99.99.99", experimental: true }
    name: e2e (GLPI ${{ matrix.glpi }}${{ matrix.upgrade && ', upgrade' || '' }})
    env:
      GLPI_VERSION: ${{ matrix.glpi }}
      PLUGIN_MAX_GLPI: ${{ matrix.max }}
      SERVER_SOURCE: server-prebuilt
      COMPOSE: docker compose
      E2E_ENV_FILE: ${{ github.workspace }}/.e2e.local.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the upgrade test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glpi-realtime-musl
          path: e2e/env/bin
      - run: chmod +x e2e/env/bin/glpi-realtime
      - name: Previous release
        if: matrix.upgrade
        run: echo "UPGRADE_FROM=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)" >> "$GITHUB_ENV"
      - name: Disposable GLPI ${{ matrix.glpi }}, plugin checks
        run: e2e/env/up.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      # The Monday run repeats each test 3 times on GLPI 12.0: intermittent failures show
      # up there, weekly, rather than by chance on someone's pull request.
      - name: npx playwright test
        working-directory: e2e
        env:
          REPEAT: ${{ matrix.glpi == '12.0' && !matrix.upgrade && (github.event_name == 'schedule' && '3' || inputs.e2e_repeat) || '1' }}
        run: npx playwright test --repeat-each="${REPEAT:-1}"
      - name: Logs
        if: failure()
        run: mkdir -p e2e/test-results && docker compose -f e2e/env/compose.yaml logs --no-color glpi > e2e/test-results/glpi.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.glpi }}${{ matrix.upgrade && '-upgrade' || '' }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  # The examples of deploy/ (and of the README), run through the software they are for:
  # server configurations, Valkey, nginx, Apache httpd, Caddy, compose.
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: scripts/check-examples.sh
        env:
          CONTAINER: docker
          COMPOSE: docker compose

  # Regression guard: 2 000 connections on 200 items; every connection, event and presence
  # update must go through, each p99 under 1 s, the load test + server under 768 MiB.
  load:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Valkey
        run: |
          id=$(docker create valkey/valkey:9.0)
          sudo docker cp "$id":/usr/local/bin/valkey-server /usr/local/bin/valkey-server
          docker rm "$id"
          valkey-server --port 0 --unixsocket /tmp/valkey.sock --save "" --appendonly no --daemonize yes
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: ulimit -n 65536 && cargo run --release --locked --example loadtest -- --valkey unix:///tmp/valkey.sock --connections 2000 --rooms 200 --check --max-p99-ms 1000 --max-rss-mib 768
        working-directory: server

  # Soak test, weekly (Monday's run) or on demand: waves of clients for 10 minutes; the
  # server must keep no connection nor presence entry between waves, and its memory must
  # level off (a leak shows as growth between the second and the last quarter).
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Valkey
        run: |
          id=$(docker create valkey/valkey:9.0)
          sudo docker cp "$id":/usr/local/bin/valkey-server /usr/local/bin/valkey-server
          docker rm "$id"
          valkey-server --port 0 --unixsocket /tmp/valkey.sock --save "" --appendonly no --daemonize yes
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: ulimit -n 65536 && cargo run --release --locked --example soak -- --valkey unix:///tmp/valkey.sock --duration-secs 600 --connections 500 --rooms 50 --check
        working-directory: server

  # What browsers and Valkey send the server (frames, rooms, event batches, handshake
  # headers), fuzzed for a minute each.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: Fuzz
        working-directory: server
        # The host's target: cargo-fuzz defaults to the one it was built for, and the
        # prebuilt binary is a static (musl) one, which sanitizers refuse.
        run: |
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          for t in message room batch handshake; do
            cargo +nightly fuzz run "$t" --fuzz-dir fuzz --target "$host" -- -max_total_time=60
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: server/fuzz/artifacts/
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - name: Rust dependencies
        run: cargo audit
        working-directory: server
      - name: npm dependencies (build tools only)
        run: npm audit --audit-level=high
        working-directory: client
      - name: npm dependencies (end-to-end tests)
        run: npm audit --audit-level=high
        working-directory: e2e

  # Release archives for v* tags: one per architecture (static binaries, built natively),
  # then published together with their checksums and build provenance attestations
  # (gh attestation verify <archive> --repo <owner>/glpi-realtime).
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, audit, e2e, load, fuzz, examples]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: arch
        run: echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch, 2026-10-15
        with:
          toolchain: stable
          targets: ${{ steps.arch.outputs.arch }}-unknown-linux-musl
      - run: sudo apt-get install -y musl-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: client
      - name: Archives (the suites ran in the test job)
        run: SKIP_TESTS=1 scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.arch.outputs.arch }}
          path: dist/*.tar.*
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && ls -l && sha256sum ./*.tar.* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.*
            dist/SHA256SUMS

  # The server's image, for amd64 and arm64 (the release's static binaries), with a build
  # provenance attestation: ghcr.io/<owner>/glpi-realtime:<version> and :latest.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/glpi-realtime"
          for pair in x86_64:amd64 aarch64:arm64; do
            mkdir -p "deploy/container/bin/${pair#*:}"
            tar -xzf "dist/glpi-realtime-$version-linux-${pair%%:*}.tar.gz" -O "glpi-realtime-$version/bin/glpi-realtime" > "deploy/container/bin/${pair#*:}/glpi-realtime"
            chmod +x "deploy/container/bin/${pair#*:}/glpi-realtime"
          done
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$image:$version" -t "$image:latest" --metadata-file meta.json deploy/container
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # What users get: the published archive, checked as the README says (checksum,
  # attestation), installed with deploy/install.sh in a disposable GLPI, then the
  # end-to-end tests; and the published image starts.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      COMPOSE: docker compose
      E2E_ENV_FILE: ${{ github.workspace }}/.e2e.local.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -D dl -p "glpi-realtime-$version-linux-x86_64.tar.gz" -p SHA256SUMS
          (cd dl && sha256sum --check --ignore-missing SHA256SUMS)
          gh attestation verify "dl/glpi-realtime-$version-linux-x86_64.tar.gz" --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_ARCHIVE=$PWD/dl/glpi-realtime-$version-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
      - name: The image starts and checks its configuration
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/glpi-realtime:${GITHUB_REF_NAME#v}"
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY"
          docker run --rm -e GLPI_RT_SECURITY__ALLOWED_ORIGINS='["https://glpi.example.org"]' "$image" --check
      - name: Disposable GLPI with the release installed
        run: e2e/env/up.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-check
          path: e2e/test-results/
          retention-days: 7
