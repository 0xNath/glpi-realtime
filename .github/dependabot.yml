# Weekly dependency updates, grouped per ecosystem (one pull request each). The CI runs
# every suite, the audits and the end-to-end tests on them. Versions are proposed once
# they are 14 days old (cooldown), as the project's rule asks.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      client: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      e2e: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
