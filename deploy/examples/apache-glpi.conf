# GLPI vhost for Apache httpd 2.4.47 or later, with glpi-realtime on /ws.
# Modules: proxy, proxy_http, rewrite, ssl (Debian: a2enmod proxy proxy_http rewrite ssl).
# Only the lines between "glpi-realtime" markers are specific to this project.

<VirtualHost *:443>
    ServerName glpi.example.org
    SSLEngine on
    SSLCertificateFile    /etc/ssl/glpi/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/glpi/privkey.pem

    DocumentRoot /var/www/glpi/public

    # --- glpi-realtime ------------------------------------------------------------------
    # The WebSocket goes to the server's unix socket (listen.path of config.toml).
    # upgrade=websocket: Apache >= 2.4.47. Older 2.4: mod_proxy_wstunnel and
    #   ProxyPass "/ws" "unix:/run/glpi-realtime/rt.sock|ws://localhost/ws"
    ProxyPass "/ws" "unix:/run/glpi-realtime/rt.sock|http://localhost/ws" upgrade=websocket timeout=3600
    ProxyPreserveHost On
    # --- /glpi-realtime -----------------------------------------------------------------

    # GLPI (as documented by GLPI for version 11 and later)
    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
</VirtualHost>

# Apache has no built-in per-IP rate limit for the handshake (nginx's limit_req): the
# server limits connections per user and per instance itself. With the event MPM, size
# ServerLimit/ThreadsPerChild/MaxRequestWorkers for the number of WebSockets: each one
# holds a worker thread while proxied.
