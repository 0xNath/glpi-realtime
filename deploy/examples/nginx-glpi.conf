# GLPI vhost for nginx, with glpi-realtime on /ws. Adapt names, paths and PHP-FPM socket.
# Only the lines between "glpi-realtime" markers are specific to this project: add them to
# your existing GLPI vhost if you have one.

# --- glpi-realtime (http level: outside the server block) -------------------------------
upstream glpi_realtime {
    server unix:/run/glpi-realtime/rt.sock;    # listen.path of config.toml
}
# WebSocket handshakes: 30/min per IP (clients reconnect with backoff: generous).
limit_req_zone $binary_remote_addr zone=glpi_ws:10m rate=30r/m;
# --- /glpi-realtime ---------------------------------------------------------------------

server {
    listen 443 ssl;
    http2 on;
    server_name glpi.example.org;
    ssl_certificate     /etc/ssl/glpi/fullchain.pem;
    ssl_certificate_key /etc/ssl/glpi/privkey.pem;

    root /var/www/glpi/public;

    # --- glpi-realtime ------------------------------------------------------------------
    location = /ws {
        limit_req zone=glpi_ws burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived connections (the server pings every 30 s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    # --- /glpi-realtime -----------------------------------------------------------------

    # GLPI (as documented by GLPI for version 11 and later)
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location ~ ^/index\.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;       # your PHP-FPM pool
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# For 20 000 WebSockets, in nginx.conf (main context): every proxied WebSocket uses two
# connections and two file descriptors.
#   worker_rlimit_nofile 100000;
#   events { worker_connections 16384; }
