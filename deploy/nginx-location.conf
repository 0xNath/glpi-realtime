    # --- glpi-realtime: inside the HTTPS server block of the GLPI vhost ---
    location = /ws {
        limit_req zone=glpi_ws burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://glpi_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived connections: the server pings every 30 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        # Logged when the WebSocket closes (status 101 = was connected).
    }
    # --- /glpi-realtime ---
