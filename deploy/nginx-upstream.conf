# --- glpi-realtime: http-level directives (top of the GLPI vhost file) ---
upstream glpi_realtime {
    server unix:/run/glpi-realtime/rt.sock;
}
# WebSocket handshakes: 30/min per IP (reconnections use backoff, so this is generous)
limit_req_zone $binary_remote_addr zone=glpi_ws:10m rate=30r/m;
# --- /glpi-realtime ---
