[package]
name = "glpi-realtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
fred = { version = "10.1.0", default-features = false, features = ["i-hashes", "i-hexpire", "i-keys", "i-pubsub", "i-std", "subscriber-client", "unix-sockets"] }
futures-util = "0.3.34"
governor = "0.10.4"
hex = "0.4.3"
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
