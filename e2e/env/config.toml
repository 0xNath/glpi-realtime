# glpi-realtime in the disposable e2e environment (defaults otherwise).
[listen]
type = "unix"
path = "/run/glpi-realtime/rt.sock"
mode = 0o660
group = "www-data"

[valkey]
url = "unix:///run/valkey/valkey.sock"
db = 6

[security]
allowed_origins = ["https://localhost:8443"]

[revocation]
keyspace_events = true
sweep_interval_secs = 3   # the resilience test restarts Valkey: sessions lost, found by the sweep
