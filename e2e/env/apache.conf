# deploy/examples/apache-glpi.conf, on port 8443 with a self-signed certificate.
<VirtualHost *:8443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    /etc/ssl/glpi/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/glpi/privkey.pem

    DocumentRoot /var/www/glpi/public
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # --- glpi-realtime ------------------------------------------------------------------
    ProxyPass "/ws" "unix:/run/glpi-realtime/rt.sock|http://localhost/ws" upgrade=websocket timeout=3600
    ProxyPreserveHost On
    # --- /glpi-realtime -----------------------------------------------------------------

    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
</VirtualHost>
